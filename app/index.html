<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Studio — multi-panel poster covers</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" id="controls">
    <h1>Cover Studio</h1>
    <p class="tagline">Your photos, three panels, one sunset poster. Everything stays on your machine.</p>

    <h2>1 · Photos</h2>
    <div class="slot">
      <label>Photo 1 <input id="photo1" type="file" accept="image/*"></label>
      <button id="sample1" type="button">Use sample boulevard</button>
      <span id="slotLabel1" class="slot-label"></span>
    </div>
    <div class="slot">
      <label>Photo 2 <input id="photo2" type="file" accept="image/*"></label>
      <button id="sample2" type="button">Use sample boulevard</button>
      <span id="slotLabel2" class="slot-label"></span>
    </div>
    <div class="slot">
      <label>Photo 3 <input id="photo3" type="file" accept="image/*"></label>
      <button id="sample3" type="button">Use sample pier</button>
      <span id="slotLabel3" class="slot-label"></span>
    </div>
    <label class="check"><input id="fillOne" type="checkbox" checked> Fill all panels with photo 1</label>

    <div id="panelControls">
      <h2>Panels</h2>
      <label>Panel
        <select id="panel">
          <option value="0">Panel 1 — hero</option>
          <option value="1">Panel 2</option>
          <option value="2">Panel 3</option>
          <option value="3">Panel 4 (grid)</option>
        </select>
      </label>
      <label>Photo in this panel
        <select id="panelPhoto">
          <option value="0">Photo 1</option>
          <option value="1">Photo 2</option>
          <option value="2">Photo 3</option>
        </select>
      </label>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Move left / right <input id="panX" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Move up / down <input id="panY" type="range" min="-1" max="1" step="0.05" value="0"></label>
    </div>

    <h2>2 · Layout</h2>
    <div class="choices">
      <label><input type="radio" name="layout" value="trio" checked> Vice trio</label>
      <label><input type="radio" name="layout" value="strip"> Sunset strip</label>
      <label><input type="radio" name="layout" value="grid"> Neon grid</label>
    </div>

    <h2>3 · Caption</h2>
    <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
    <label>Sub-caption <input id="subcaption" type="text" maxlength="60" value="Boulevard Queen"></label>
    <label>Caption size <input id="captionScale" type="range" min="0.6" max="1.4" step="0.05" value="1"></label>

    <h2>4 · Grade</h2>
    <label>Sunset strength <input id="sunset" type="range" min="0" max="1" step="0.05" value="0.7"></label>
    <label class="check"><input id="neon" type="checkbox" checked> Neon gutter glow</label>
    <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>

    <h2>5 · Size &amp; export</h2>
    <div class="choices">
      <label><input type="radio" name="size" value="square"> Square 1080 × 1080</label>
      <label><input type="radio" name="size" value="portrait"> Portrait 1080 × 1350</label>
      <label><input type="radio" name="size" value="wide" checked> Wide 1920 × 1080</label>
    </div>
    <button id="export" type="button">Export PNG (<span id="sizeLabel">1920 x 1080</span>)</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview">
    <canvas id="preview" width="1920" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
